<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Article Detail</title>
</head>
<body>
    <h1>Article detail</h1>
    <hr>
    <!--2026/09/23 - 추후 UI개선을 해볼예정-->
    <!--제목 출력-->
    <h2 th:text="${article.title}">Title</h2>
    <!--2026/09.08 - 21:40 추가-->
    <!--조회수 기능 추가-->
    <span>조회수: <span th:text="${article.viewCount}"></span></span>
    <!--내용 출력-->
    <p th:text="${article.content}">Content</p>

    <!--이미지가 있을경우에-->
    <div th:if="${article.imageUrl != null}">
        <img th:src="${article.imageUrl}"
             alt="attach image"
             style="max-width: 400px;
             display: block;
             margin-top:10px;">
    </div>
    <!--max-width는 이미지 최대 너비 400px display는 블록으로 표시, margin-top 위에 여백 10px-->
    <br>
    <hr>
    <a href="/">back to home</a>
    <!--"/"주소로 이동하는 링크임-->

    <!--2026/09/05 22:53 추가-->
    <!--수정, 삭제-->
    <a th:href="@{/article/{id}/edit(id=${article.id})}">Article Edit</a>

    <!--기존 삭제버튼은 삭제함-->
    <!--<form
        th:action="@{/article/{id}/delete(id=${article.id})}"
        method="post"
        style="display:inline;"
    >
        <button type="submit">Delete</button>
    </form>-->

    <!--2026/09/06 23:00 추가-->
    <form
            th:action="@{/article/{id}/delete(id=${article.id})}"
            method="post"
            style="display:inline;"
    >
        <!--삭제 요청을 보내는 주소를 만들며, post방식, 폼이 한 줄을 전부 차지 않도록 설정
        {id에는 현재 게시글 id가 들어감. ex: /article/3/delete }-->
        <button
                type="submit"
                onclick="return confirm('Sure Delete?');"
        >
            Delete
        </button>
        <!--submit할 시 form안의 내용을 서버로 전송, 삭제주소로 POST요청 전송됨
        delete버튼 클릭시 확인창을 띄움 confirm은 확인/취소 버튼이 있는 팝업창임
        확인을 누르면 true반환되어 삭제 요청 진행, 취소 누르면 false반환되어 삭제요청 취소
        return은 confirm결과를 버튼 동작에 적용한다는 뜻임.-->
    </form>
    <!--
        delete 클릭시 You sure delete? 출력 확인 클릭시 삭제 취소 시 삭제X
    -->

    <!--2026/09/13 - 22:30 댓글 기능 추가-->
    <h3>
        Comments (
        <span th:text="${#lists.size(comments)}">0</span>
        )
    </h3>

    <form th:action="@{/article/{id}/comment(id=${article.id})}" method="post">
        <textarea
                name="content"
                required
                rows="3"
                cols="50"
                placeholder="댓글을 입력하세요."
        ></textarea>
        <button type="submit">Comment</button>
    </form>
<!--    <ul>-->
<!--        <li th:each="comment : ${comments}">-->
<!--            <span th:text="${comment.content}"></span>-->
<!--        </li>-->
<!--        &lt;!&ndash;comment 내용 하나씩 반복하여 꺼낸뒤 comment이름으로 사용&ndash;&gt;-->
<!--    </ul>-->
<!--2026/09/15 - 22:00 기존 댓글 기능과 통합-->
    <!--2026/09/15 - 21:44 댓글 삭제 기능 추가-->
    <p th:if="${#lists.isEmpty(comments)}">
        아직 작성된 댓글이 없습니다.
    </p>
    <ul>
        <li th:each="comment : ${comments}">
            <span th:text="${comment.content}">Comment content</span>

            <form
                    th:action="@{/article/{articleId}/comment/{commentId}/delete(
                articleId=${article.id},
                commentId=${comment.id}
            )}"
                    method="post"
                    style="display:inline;"
            >
                <button
                        type="submit"
                        onclick="return confirm('Sure Delete Comment?');"
                >Delete</button>
            </form>
        </li>
    </ul>
</body>
</html>
