<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form
        th:action="@{/article/{id}/edit(id=${article.id})}"
        method="post"
    >
        <input
            type="text"
            name="title"
            th:value="${article.title}"
            required
        >
        <textarea
            name="content"
            th:text="${article.content}"
            required
            ></textarea>
        <button type="submit">Save</button>
    </form>
</body>
</html>
